name: Docs

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    name: Validate docs - ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    # Bumped by hand: Dependabot doesn't read npx calls.
    - name: Validate docs
      run: npx --yes @fkrzski/docs-schema@0.5.0 docs

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'release'

    name: Trigger docs deploy

    steps:

    # The docs site rebuilds every project's docs/ afresh, so a release only has
    # to signal it; the hook URL is a secret, one per project.
    - name: Trigger docs deploy
      env:
        DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
      run: curl -fsS -X POST "$DOCS_DEPLOY_HOOK"
